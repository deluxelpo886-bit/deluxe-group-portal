name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify CSP hash matches inline script
        run: npm run check-csp-hash

      - name: Smoke test - server boots and health check responds
        run: |
          node server/server.js &
          SERVER_PID=$!
          ok=0
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then ok=1; break; fi
            sleep 1
          done
          kill "$SERVER_PID" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then echo "Server did not become healthy"; exit 1; fi
          echo "Server health check passed"
