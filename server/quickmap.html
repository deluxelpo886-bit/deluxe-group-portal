function err(t){var e=document.getElementById("msg");e.textContent=t;e.style.display="block";}
if(typeof L==="undefined"){err("Map engine did not load - please reload.");}else{
var map=L.map("map",{zoomControl:true}).setView([24.42,54.55],9);

var switched=false; osm.on("tileerror",function(){ if(switched)return; switched=true; osm.setUrl("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}"); });
function statusColor(s){s=(s||"").toLowerCase();if(s.indexOf("break")>=0)return "#e0443a";if(s.indexOf("hire")>=0)return "#2ec27e";if(s.indexOf("repair")>=0||s.indexOf("service")>=0)return "#e8a13a";return "#9aa7b4";}
function parseD(d){var m=/^(\d{2})\/(\d{2})\/(\d{4})/.exec(d||"");return m?new Date(+m[3],+m[2]-1,+m[1]):null;}
function daysBetween(a,b){return Math.round((b-a)/86400000);}
function health(p){
  var today=new Date();today.setHours(0,0,0,0);
  var estH=null,hoursLeft=null;
  if(p.lastH!=null){var ld=parseD(p.lastD);var dr=(p.daily!=null&&p.daily>0)?p.daily:0;var since=ld?Math.max(0,daysBetween(ld,today)):0;estH=Math.round(p.lastH+dr*since);if(p.nextH!=null)hoursLeft=p.nextH-estH;}
  var nd=parseD(p.nextD);var daysTo=nd?daysBetween(today,nd):null;
  var state="ok",label="On track",col="#2ec27e";
  if((hoursLeft!=null&&hoursLeft<=0)||(daysTo!=null&&daysTo<0)){state="over";label="SERVICE OVERDUE";col="#e0443a";}
  else if((hoursLeft!=null&&hoursLeft<=50)||(daysTo!=null&&daysTo<=5)){state="soon";label="Service due soon";col="#e8a13a";}
  return {estH:estH,hoursLeft:hoursLeft,daysTo:daysTo,state:state,label:label,col:col};
}
function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
var byDg={};var bounds=[];
PTS.forEach(function(p){
  var h=health(p);
  var ring=h.state==="over"?"#e0443a":(h.state==="soon"?"#e8a13a":"#0c141d");
  var ringW=h.state==="ok"?1.5:3;
  var m=L.circleMarker([p.lat,p.lon],{radius:7,color:ring,weight:ringW,fillColor:statusColor(p.status),fillOpacity:0.95}).addTo(map);
  var gm="https://maps.google.com/?q="+p.lat+","+p.lon;
  var hrs=(h.estH!=null)?("~"+h.estH+" h"+(p.lastH!=null?(" (last svc "+p.lastH+"h)"):"")):"n/a";
  var nxt=(p.nextD?esc(p.nextD):"")+(h.hoursLeft!=null?(" &middot; "+h.hoursLeft+" h left"):"");
  var html="<b>"+esc(p.dg)+"</b> &middot; "+esc(p.kva)+" kVA "+esc(p.brand)+"<br>"+esc(p.status)+(p.customer?("<br>"+esc(p.customer)):"")+(p.location?("<br>"+esc(p.location)):"")+"<br>&#9201; Hours: "+hrs+"<br>&#128295; Next service: "+(nxt||"n/a")+"<br><span class=hb style=\"background:"+h.col+"\">"+h.label+"</span><br><a class=gm href=\""+gm+"\" target=_blank rel=noopener>&#128663; Open in Google Maps</a>";
  m.bindPopup(html);
  byDg[String(p.dg).toUpperCase().replace(/[^0-9]/g,"")]=m; bounds.push([p.lat,p.lon]);
});
if(bounds.length)map.fitBounds(bounds,{padding:[30,30]});
[200,800,2000].forEach(function(t){setTimeout(function(){map.invalidateSize();},t);});
function truckIcon(){return L.divIcon({className:"",html:"<div class=truck>&#128667;</div>",iconSize:[22,22],iconAnchor:[11,11]});}
fetch("/api/positions",{credentials:"same-origin"}).then(function(r){return r.ok?r.json():null;}).then(function(d){
  if(!d||!d.vehicles||!d.vehicles.length)return;
  d.vehicles.forEach(function(v){
    if(typeof v.lat!=="number"||typeof v.lon!=="number")return;
    var tm=L.marker([v.lat,v.lon],{icon:truckIcon(),zIndexOffset:1000}).addTo(map);
    var kmh=v.speed?Math.round(v.speed*1.852):0;
    tm.bindPopup("<b>&#128667; "+esc(v.name||v.plate||"Vehicle")+"</b>"+(v.team?("<br>Team: "+esc(v.team)):"")+(v.driver?("<br>Driver: "+esc(v.driver)):"")+(v.plate?("<br>Plate: "+esc(v.plate)):"")+"<br>Speed: "+kmh+" km/h<br>"+((d.live===false)?"<i>last known</i>":"<i>live</i>"));
  });
}).catch(function(){});
function find(){var v=(document.getElementById("find").value||"").replace(/[^0-9]/g,"");if(!v)return;var m=byDg[v];if(m){map.setView(m.getLatLng(),15);m.openPopup();}else{err("DG-"+v+" not found / no location pin.");}}
