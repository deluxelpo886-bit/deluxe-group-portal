<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deluxe — Workshop / Repair Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3b66">
<style>
  :root{--bg:#0a0e13;--panel:#141b24;--panel2:#1a222c;--line:#2a333d;--text:#eef3f7;--mut:#93a1b0;--faint:#5f6b78;
    --amber:#e8a13a;--green:#41c98a;--red:#f0655a;--blue:#5aa2e6;--sans:'Inter','Segoe UI',-apple-system,sans-serif;--mono:ui-monospace,Menlo,monospace;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);padding:16px 14px 70px;line-height:1.5;}
  .wrap{max-width:820px;margin:0 auto;}
  .navback{display:inline-block;margin-bottom:12px;color:var(--amber);text-decoration:none;font-size:13px;font-weight:700;}
  h1{font-size:22px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:9px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:14px;}
  .stat .n{font-size:30px;font-weight:850;color:var(--amber);line-height:1;} .stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);margin-top:6px;}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-weight:800;font-size:14px;cursor:pointer;background:var(--amber);color:#1a1200;}
  .btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  .btn.small{padding:7px 12px;font-size:12.5px;}
  .btn.danger{background:rgba(240,101,90,.15);color:var(--red);border:1px solid rgba(240,101,90,.4);}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;margin:18px 2px 10px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .rc{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;background:var(--panel2);}
  .rc .top{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
  .rc .dg{font-family:var(--mono);font-weight:800;font-size:16px;}
  .badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;}
  .b-under{background:rgba(90,162,230,.16);color:var(--blue);} .b-repairing{background:rgba(232,161,58,.16);color:var(--amber);}
  .b-parts{background:rgba(240,101,90,.16);color:var(--red);} .b-done{background:rgba(65,201,138,.16);color:var(--green);}
  .rc .meta{font-size:12.5px;color:var(--mut);margin-bottom:9px;}
  .rc .acts{display:flex;gap:8px;flex-wrap:wrap;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;} th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);} th{color:var(--mut);font-size:10.5px;text-transform:uppercase;}
  .empty{color:var(--mut);text-align:center;padding:22px;font-size:13px;}
  #histToggle{cursor:pointer;}
  /* modal */
  #ov{position:fixed;inset:0;background:rgba(5,8,12,.82);display:none;align-items:center;justify-content:center;padding:18px;z-index:50;}
  #ov.on{display:flex;} .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:440px;width:100%;max-height:92vh;overflow:auto;}
  .modal h3{font-size:18px;margin-bottom:14px;} .f{margin-bottom:11px;} .f label{display:block;font-size:11px;text-transform:uppercase;color:var(--faint);margin-bottom:4px;}
  .f input,.f select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px 11px;font-size:14px;font-family:var(--sans);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
  #overlay{position:fixed;inset:0;background:rgba(5,8,12,.85);display:none;align-items:center;justify-content:center;padding:20px;z-index:60;}
  #overlay .modal{max-width:340px;} #overlay input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 11px;margin-bottom:10px;font-size:14px;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f1620;border:1px solid var(--line);padding:11px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:70;} .toast.show{opacity:1;}
</style>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/portal-sw.js').catch(function(){});});}</script>
</head>
<body>
<div class="wrap">
  <a class="navback" href="/menu">☰ Menu</a>
  <h1>🔧 Workshop — Repair Tracking</h1>
  <div class="stats" id="stats"></div>
  <button class="btn" id="addBtn">+ Send generator to workshop</button>

  <div class="sec">Active repairs</div>
  <div class="panel"><div id="active"><div class="empty">Loading…</div></div></div>

  <div class="sec" id="histToggle">▸ Repair history (completed) — click to expand</div>
  <div class="panel" id="histPanel" style="display:none;"><div id="history"></div></div>
</div>

<div id="ov"><div class="modal">
  <h3 id="mTitle">Send generator to workshop</h3>
  <div class="f"><label>Generator (DG)</label><select id="m_dg"></select></div>
  <div class="f"><label>Issue / complaint</label><input id="m_issue" placeholder="e.g. Overheating, fuel pump fault"></div>
  <div class="grid2"><div class="f"><label>Technician</label><input id="m_tech" placeholder="Name"></div>
    <div class="f"><label>Date in</label><input type="date" id="m_datein"></div></div>
  <div class="f"><label>Repair status</label><select id="m_status">
    <option value="Under Repair">Under Repair (queued / diagnosis)</option>
    <option value="Repairing">Repairing (working now)</option>
    <option value="Awaiting Parts">Awaiting Parts</option>
    <option value="Repair Completed">Repair Completed — ready for hire</option></select></div>
  <div class="f"><label>Notes</label><input id="m_notes" placeholder="Optional"></div>
  <div class="mact"><button class="btn danger small" id="mDel" style="display:none;">Delete</button><button class="btn secondary" id="mCancel">Cancel</button><button class="btn" id="mSave">Save</button></div>
</div></div>

<div id="overlay"><div class="modal">
  <h3 style="font-size:18px;margin-bottom:4px;">Workshop — Sign in</h3>
  <p style="color:var(--mut);font-size:13px;margin-bottom:14px;">Sign in to view the workshop.</p>
  <input type="text" id="loginEmail" placeholder="deluxeoperationhead" autocomplete="username">
  <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
  <div style="color:var(--red);font-size:13px;min-height:18px;" id="loginErr"></div>
  <button class="btn" style="width:100%;" id="loginBtn">Sign in</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var LS='deluxeFleetToken'; var TOKEN=localStorage.getItem(LS)||'';
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function authH(){return {'Authorization':'Bearer '+TOKEN};}
  function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1700);}
  var REPAIRS=[], DIR={}, editId=null;

  function showLogin(m){$('overlay').style.display='flex';if(m)$('loginErr').textContent=m;}
  function hideLogin(){$('overlay').style.display='none';boot();}
  async function doLogin(){var email=$('loginEmail').value.trim(),password=$('loginPass').value;$('loginErr').textContent='';
    try{var r=await fetch('/api/fleet/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})});
      var d=await r.json();if(!r.ok){$('loginErr').textContent=d.message||'Sign in failed';return;} TOKEN=d.token;localStorage.setItem(LS,TOKEN);hideLogin();}catch(e){$('loginErr').textContent='Network error';}}
  $('loginBtn').addEventListener('click',doLogin);
  $('loginPass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});

  var BCLS={'Under Repair':'b-under','Repairing':'b-repairing','Awaiting Parts':'b-parts','Repair Completed':'b-done'};
  function daysSince(dmy){ var p=String(dmy||'').split('/'); if(p.length!==3) return null; var dt=new Date(p[2],p[1]-1,p[0]); return Math.max(0,Math.round((new Date()-dt)/86400000)); }

  async function boot(){
    try{ var d=await (await fetch('/api/fleet/directory',{headers:authH()})).json(); DIR=d.directory||{}; }catch(e){}
    load();
  }
  async function load(){
    try{ var r=await fetch('/api/repairs',{cache:'no-store',headers:authH()}); if(r.status===401){showLogin();return;}
      var d=await r.json(); REPAIRS=d.repairs||[]; renderStats(d.stats||{}); renderActive(); renderHistory();
    }catch(e){ $('active').innerHTML='<div class="empty">Could not load.</div>'; }
  }
  function renderStats(s){ var tiles=[[s.inWorkshop||0,'Currently in workshop'],[s.underRepair||0,'Under repair (queued)'],[s.repairing||0,'Repairing now'],[s.awaitingParts||0,'Awaiting parts'],[s.completed||0,'Completed (all time)']];
    $('stats').innerHTML=tiles.map(function(t){return '<div class="stat"><div class="n">'+t[0]+'</div><div class="l">'+t[1]+'</div></div>';}).join(''); }
  function renderActive(){ var rows=REPAIRS.filter(function(r){return r.repair_status!=='Repair Completed';});
    if(!rows.length){ $('active').innerHTML='<div class="empty">Nothing in the workshop right now.</div>'; return; }
    $('active').innerHTML=rows.map(function(r){ var days=daysSince(r.date_in);
      return '<div class="rc"><div class="top"><span class="dg">'+esc(r.dg)+'</span><span class="badge '+(BCLS[r.repair_status]||'b-under')+'">'+esc(r.repair_status)+'</span></div>'+
        '<div class="meta">Issue: '+esc(r.issue||'-')+'<br>Technician: '+esc(r.technician||'-')+' · In workshop '+(days!=null?days+' day(s)':'—')+' (since '+esc(r.date_in||'—')+')'+(r.notes?'<br>Notes: '+esc(r.notes):'')+'</div>'+
        '<div class="acts"><button class="btn secondary small" data-edit="'+esc(r.id)+'">Update status</button><button class="btn small" data-done="'+esc(r.id)+'">✓ Mark completed</button></div></div>'; }).join('');
    wireRows();
  }
  function renderHistory(){ var rows=REPAIRS.filter(function(r){return r.repair_status==='Repair Completed';});
    if(!rows.length){ $('history').innerHTML='<div class="empty">No completed repairs yet.</div>'; return; }
    var h='<table><thead><tr><th>Repair ID</th><th>DG</th><th>Issue</th><th>Tech</th><th>In</th><th>Completed</th><th></th></tr></thead><tbody>';
    rows.forEach(function(r){ h+='<tr><td>'+esc(r.repair_id)+'</td><td>'+esc(r.dg)+'</td><td>'+esc(r.issue||'-')+'</td><td>'+esc(r.technician||'-')+'</td><td>'+esc(r.date_in||'—')+'</td><td>'+esc(r.date_completed||'—')+'</td><td><button class="btn secondary small" data-edit="'+esc(r.id)+'">Edit</button></td></tr>'; });
    h+='</tbody></table>'; $('history').innerHTML=h; wireRows();
  }
  function wireRows(){
    document.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick=function(){ openEdit(b.getAttribute('data-edit')); }; });
    document.querySelectorAll('[data-done]').forEach(function(b){ b.onclick=function(){ var r=REPAIRS.filter(function(x){return x.id===b.getAttribute('data-done');})[0]; if(r && confirm('Mark '+r.dg+' as Repair Completed?')) saveRec({id:r.id,dg:r.dg,issue:r.issue,technician:r.technician,date_in:r.date_in,repair_status:'Repair Completed',notes:r.notes}); }; });
  }

  function dgOptions(cur){ var keys=Object.keys(DIR).sort(); return keys.map(function(k){var g=DIR[k];return '<option value="'+esc(k)+'"'+(k===cur?' selected':'')+'>'+esc(k)+(g.kva?' — '+esc(g.kva)+'kVA':'')+(g.customer?' — '+esc(g.customer):'')+'</option>';}).join(''); }
  function toISO(dmy){ var p=String(dmy||'').split('/'); if(p.length!==3) return ''; return p[2]+'-'+p[1]+'-'+p[0]; }
  function toDMY(iso){ var p=String(iso||'').split('-'); if(p.length!==3) return ''; return p[2]+'/'+p[1]+'/'+p[0]; }
  function openAdd(){ editId=null; $('mTitle').textContent='Send generator to workshop'; $('mDel').style.display='none';
    $('m_dg').innerHTML=dgOptions(null); $('m_issue').value=''; $('m_tech').value=''; $('m_datein').value=new Date().toISOString().slice(0,10); $('m_status').value='Under Repair'; $('m_notes').value=''; $('ov').classList.add('on'); }
  function openEdit(id){ var r=REPAIRS.filter(function(x){return x.id===id;})[0]; if(!r) return; editId=id;
    $('mTitle').textContent='Edit — '+r.repair_id+' ('+r.dg+')'; $('mDel').style.display='inline-block';
    $('m_dg').innerHTML=dgOptions(r.dg); $('m_issue').value=r.issue||''; $('m_tech').value=r.technician||''; $('m_datein').value=toISO(r.date_in); $('m_status').value=r.repair_status; $('m_notes').value=r.notes||''; $('ov').classList.add('on'); }
  async function saveRec(rec){ try{ var r=await fetch('/api/repairs/save',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authH()),body:JSON.stringify(rec)}); if(r.status===401){showLogin();return;} if(!r.ok) throw new Error(); $('ov').classList.remove('on'); toast('Saved'); load(); }catch(e){ toast('Save failed'); } }
  $('addBtn').addEventListener('click',openAdd);
  $('mCancel').addEventListener('click',function(){ $('ov').classList.remove('on'); });
  $('mSave').addEventListener('click',function(){ var dg=$('m_dg').value; if(!dg){toast('Pick a generator');return;}
    saveRec({id:editId,dg:dg,kva:(DIR[dg]&&DIR[dg].kva)||'',issue:$('m_issue').value.trim(),technician:$('m_tech').value.trim(),date_in:toDMY($('m_datein').value),repair_status:$('m_status').value,notes:$('m_notes').value.trim()}); });
  $('mDel').addEventListener('click',function(){ if(editId && confirm('Delete this repair record?')){ fetch('/api/repairs/remove',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authH()),body:JSON.stringify({id:editId})}).then(function(){ $('ov').classList.remove('on'); toast('Removed'); load(); }); } });
  $('histToggle').addEventListener('click',function(){ var p=$('histPanel'); var show=p.style.display==='none'; p.style.display=show?'block':'none'; $('histToggle').textContent=(show?'▾':'▸')+' Repair history (completed) — click to expand'; });

  if(TOKEN){ boot(); } else { showLogin(); }
})();
</script>
</body>
</html>
