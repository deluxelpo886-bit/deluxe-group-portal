<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Deluxe — Monthly Service Report</title>
<style>
  :root{
    --bg:#0f141a; --panel:#ffffff; --ink:#15202b; --mut:#667487; --line:#e5e9ef;
    --green:#0b7a3b; --greenD:#0b3d2e; --amber:#e6952a; --red:#d2443a; --blue:#2f6df0;
    --soft:#f4f7f5; --chip:#eef4f1;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:#eef1f4; color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  a{ color:inherit; }

  /* ---- top bar ---- */
  .top{ position:sticky; top:0; z-index:20; background:var(--greenD); color:#fff;
    padding:11px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; box-shadow:0 2px 10px rgba(0,0,0,.18); }
  .top .brand{ font-weight:800; font-size:15px; letter-spacing:.2px; display:flex; align-items:center; gap:8px; }
  .top .brand .dot{ width:9px; height:9px; border-radius:50%; background:#49d17f; box-shadow:0 0 0 4px rgba(73,209,127,.18); }
  .top .sp{ flex:1; }
  .top select,.top button{ font:inherit; font-size:13px; border-radius:9px; border:1px solid rgba(255,255,255,.18); padding:8px 11px; }
  .top select{ background:#0e5134; color:#fff; font-weight:600; min-width:150px; }
  .top button{ background:#f0a829; color:#241700; font-weight:700; border:none; cursor:pointer; }
  .top button.ghost{ background:rgba(255,255,255,.12); color:#fff; }
  .top a.nav{ color:#cfe9db; text-decoration:none; font-size:12.5px; font-weight:600; }

  .wrap{ max-width:1080px; margin:0 auto; padding:16px 14px 60px; }

  /* ---- sign in ---- */
  .signin{ max-width:360px; margin:12vh auto; background:#fff; border-radius:16px; padding:26px 22px; box-shadow:0 10px 40px rgba(0,0,0,.18); }
  .signin h2{ margin:0 0 4px; font-size:19px; }
  .signin p{ margin:0 0 16px; color:var(--mut); font-size:13px; }
  .signin input{ width:100%; font:inherit; font-size:15px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:10px; }
  .signin button{ width:100%; font:inherit; font-weight:700; font-size:15px; padding:12px; border:none; border-radius:10px; background:var(--greenD); color:#fff; cursor:pointer; }
  .err{ color:var(--red); font-size:12.5px; min-height:16px; }

  /* ---- hero stat tiles ---- */
  .hero{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
  .tile{ background:var(--panel); border-radius:14px; padding:15px 16px; box-shadow:0 1px 3px rgba(16,24,40,.07); position:relative; overflow:hidden; }
  .tile .lab{ font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
  .tile .num{ font-size:34px; font-weight:800; line-height:1.05; margin-top:6px; }
  .tile .sub{ font-size:11.5px; color:var(--mut); margin-top:3px; }
  .tile .ic{ position:absolute; right:12px; top:12px; font-size:19px; opacity:.5; }
  .tile.g{ border-top:3px solid var(--green); }
  .tile.b{ border-top:3px solid var(--blue); }
  .tile.a{ border-top:3px solid var(--amber); }
  .tile.r{ border-top:3px solid var(--greenD); }

  .grid2{ display:grid; grid-template-columns:1.25fr .85fr; gap:14px; margin-bottom:14px; }
  .card{ background:var(--panel); border-radius:14px; padding:15px 16px; box-shadow:0 1px 3px rgba(16,24,40,.07); }
  .card h3{ margin:0 0 12px; font-size:13.5px; letter-spacing:.2px; display:flex; align-items:center; gap:7px; }
  .card h3 .mini{ font-size:11px; color:var(--mut); font-weight:600; margin-left:auto; }

  /* ---- trend bars ---- */
  .trend .row{ display:flex; align-items:center; gap:10px; margin:7px 0; cursor:pointer; }
  .trend .mlabel{ width:62px; font-size:12px; color:var(--mut); font-weight:600; flex:none; }
  .trend .track{ flex:1; background:var(--soft); border-radius:7px; height:20px; overflow:hidden; }
  .trend .fill{ height:100%; background:linear-gradient(90deg,#0b7a3b,#17a34a); border-radius:7px; min-width:3px; transition:width .4s; }
  .trend .val{ width:66px; text-align:right; font-size:12px; font-weight:700; flex:none; }
  .trend .row.sel .mlabel,.trend .row.sel .val{ color:var(--greenD); }
  .trend .row.sel .track{ outline:2px solid #bfe6cd; }

  /* ---- technician list ---- */
  .tech .row{ display:flex; align-items:center; gap:10px; margin:8px 0; }
  .tech .nm{ width:40%; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tech .track{ flex:1; background:var(--soft); border-radius:6px; height:14px; overflow:hidden; }
  .tech .fill{ height:100%; background:linear-gradient(90deg,#2f6df0,#5b8df7); border-radius:6px; }
  .tech .ct{ width:30px; text-align:right; font-size:12px; font-weight:700; }

  /* ---- filter breakdown ---- */
  .fbrk{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .fbrk .f{ background:var(--soft); border-radius:10px; padding:10px; }
  .fbrk .f .n{ font-size:22px; font-weight:800; }
  .fbrk .f .l{ font-size:11px; color:var(--mut); font-weight:600; margin-top:2px; }
  .fbrk .f .bar{ height:5px; background:#e2e8e4; border-radius:4px; margin-top:7px; overflow:hidden; }
  .fbrk .f .bar i{ display:block; height:100%; border-radius:4px; }

  /* ---- table ---- */
  .tablecard{ background:var(--panel); border-radius:14px; box-shadow:0 1px 3px rgba(16,24,40,.07); overflow:hidden; }
  .tcap{ display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tcap h3{ margin:0; font-size:14px; }
  .tcap .sp{ flex:1; }
  .tcap input{ font:inherit; font-size:13px; padding:8px 11px; border:1px solid var(--line); border-radius:9px; min-width:150px; }
  .tbl-scroll{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; min-width:680px; }
  thead th{ background:#f7faf8; color:var(--mut); font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap; }
  thead th.sorted::after{ content:' ▾'; color:var(--green); }
  thead th.asc::after{ content:' ▴'; color:var(--green); }
  tbody td{ padding:9px 12px; border-bottom:1px solid #f1f4f7; font-size:13px; white-space:nowrap; }
  tbody tr:hover td{ background:#fafcfb; }
  td.dg{ font-weight:700; }
  td.cust{ max-width:200px; overflow:hidden; text-overflow:ellipsis; }
  .badge{ display:inline-block; min-width:20px; text-align:center; font-size:10px; font-weight:800; padding:2px 5px; border-radius:5px; margin-right:3px; }
  .b-on{ background:#d9f2e3; color:#0b7a3b; }
  .b-off{ background:#f0f2f4; color:#b8c0cc; }
  .empty{ padding:30px; text-align:center; color:var(--mut); font-size:13px; }

  .foot{ text-align:center; color:var(--mut); font-size:11px; margin-top:16px; }

  @media (max-width:820px){
    .hero{ grid-template-columns:1fr 1fr; }
    .grid2{ grid-template-columns:1fr; }
  }
  @media print{
    .top,.tcap input,#refreshBtn,#printBtn{ display:none !important; }
    body{ background:#fff; }
    .card,.tile,.tablecard{ box-shadow:none; border:1px solid #ddd; }
    table{ min-width:0; }
  }
</style>
</head>
<body>

<div class="top" id="topbar" hidden>
  <div class="brand"><span class="dot"></span> Monthly Service Report</div>
  <div class="sp"></div>
  <select id="monthSel" title="Select month"></select>
  <button class="ghost" id="refreshBtn" type="button">↻</button>
  <button id="printBtn" type="button">Print / PDF</button>
  <a class="nav" href="/morning">← Plan</a>
</div>

<div class="signin" id="signin" hidden>
  <h2>Deluxe Portal</h2>
  <p>Sign in to view the service report.</p>
  <input id="em" placeholder="Login" autocomplete="username"/>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password"/>
  <div class="err" id="loginErr"></div>
  <button id="loginBtn" type="button">Sign in</button>
</div>

<div class="wrap" id="app" hidden>
  <div class="hero" id="hero"></div>
  <div class="grid2">
    <div class="card trend"><h3>📈 Services per month <span class="mini" id="trendHint">tap a month</span></h3><div id="trend"></div></div>
    <div class="card"><h3>🧰 Filters changed <span class="mini" id="fmonth"></span></h3><div class="fbrk" id="fbrk"></div></div>
  </div>
  <div class="grid2">
    <div class="tablecard" style="grid-column:1 / -1">
      <div class="tcap">
        <h3>🔧 Serviced this month</h3>
        <span class="mini" id="tcount" style="color:var(--mut);font-size:12px;font-weight:600"></span>
        <div class="sp"></div>
        <input id="search" placeholder="Search DG, customer, technician…"/>
      </div>
      <div class="tbl-scroll">
        <table id="tbl">
          <thead><tr>
            <th data-k="date">Date</th>
            <th data-k="dg">DG No.</th>
            <th data-k="kva">kVA</th>
            <th data-k="customer">Customer / Site</th>
            <th data-k="hours">Hours</th>
            <th>Filters</th>
            <th data-k="technician">Technician</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="card tech" style="margin-top:14px"><h3>👷 Technician activity <span class="mini" id="techmonth"></span></h3><div id="tech"></div></div>
  <div class="foot" id="foot"></div>
</div>

<script>
var tok=null; try{tok=localStorage.getItem('deluxeFleetToken');}catch(e){}
var REPORT=null, CURMONTH='', SORT={k:'date',dir:-1}, QUERY='';

function hdrs(){return {'Authorization':'Bearer '+tok,'Content-Type':'application/json'};}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function show(id,on){var e=document.getElementById(id); if(e) e.hidden=!on;}

function gate(){
  if(!tok){ show('signin',true); show('app',false); show('topbar',false); return; }
  show('signin',false); show('app',true); show('topbar',true); load();
}
function doLogin(){
  var em=(document.getElementById('em').value||'').trim();
  var pw=(document.getElementById('pw').value||'').trim();
  document.getElementById('loginErr').textContent='';
  fetch('/api/fleet/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})})
    .then(function(r){return r.json();})
    .then(function(d){ if(d&&d.token){ tok=d.token; try{localStorage.setItem('deluxeFleetToken',tok);}catch(_){ } gate(); }
      else document.getElementById('loginErr').textContent='Wrong login'; })
    .catch(function(){ document.getElementById('loginErr').textContent='Connection error'; });
}
function load(month){
  var u='/api/service/report'+(month?('?month='+encodeURIComponent(month)):'');
  fetch(u,{headers:hdrs()}).then(function(r){ if(r.status===401){throw{auth:1};} if(!r.ok)throw 0; return r.json(); })
    .then(function(d){ REPORT=d; CURMONTH=d.selected; render(); })
    .catch(function(e){ if(e&&e.auth){ try{localStorage.removeItem('deluxeFleetToken');}catch(_){ } tok=null; gate(); } });
}

function render(){
  if(!REPORT) return;
  renderMonthSel(); renderHero(); renderTrend(); renderFilters(); renderTech(); renderTable();
  document.getElementById('foot').textContent='Deluxe Heavy Equipment Rental L.L.C — live service log · '+new Date().toLocaleString('en-GB');
}
function renderMonthSel(){
  var sel=document.getElementById('monthSel');
  sel.innerHTML=REPORT.months.map(function(m){ return '<option value="'+m.month+'"'+(m.month===CURMONTH?' selected':'')+'>'+esc(m.label)+'</option>'; }).join('');
}
function renderHero(){
  var t=REPORT.detail.totals;
  var tiles=[
    {c:'g',ic:'⚙️',num:t.gensets,lab:'Gensets Serviced',sub:REPORT.selectedLabel},
    {c:'b',ic:'🔧',num:t.services,lab:'Service Visits',sub:(t.services-t.gensets>0?('+'+(t.services-t.gensets)+' repeat'):'all unique')},
    {c:'a',ic:'🌀',num:t.airFilter,lab:'Air Filters',sub:'of '+t.services+' services'},
    {c:'r',ic:'🛢️',num:t.oilFilter,lab:'Oil Filters',sub:t.oil+' oil changes'}
  ];
  document.getElementById('hero').innerHTML=tiles.map(function(x){
    return '<div class="tile '+x.c+'"><div class="ic">'+x.ic+'</div><div class="lab">'+x.lab+'</div><div class="num">'+x.num+'</div><div class="sub">'+esc(x.sub)+'</div></div>';
  }).join('');
}
function renderTrend(){
  var ms=REPORT.months.slice(0,9).slice().reverse();
  var max=Math.max.apply(null,ms.map(function(m){return m.services;}).concat([1]));
  document.getElementById('trend').innerHTML=ms.map(function(m){
    var w=Math.round(m.services/max*100);
    return '<div class="row'+(m.month===CURMONTH?' sel':'')+'" data-m="'+m.month+'">'
      +'<div class="mlabel">'+esc(m.label.replace(/ (\d{2})(\d{2})$/,' \'$2'))+'</div>'
      +'<div class="track"><div class="fill" style="width:'+w+'%"></div></div>'
      +'<div class="val">'+m.services+' · '+m.gensets+'dg</div></div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#trend .row'),function(r){
    r.addEventListener('click',function(){ var m=r.getAttribute('data-m'); if(m&&m!==CURMONTH){ load(m); } });
  });
}
function renderFilters(){
  var t=REPORT.detail.totals, tot=t.services||1;
  document.getElementById('fmonth').textContent=REPORT.selectedLabel;
  var items=[
    {l:'Oil',n:t.oil,c:'#0b7a3b'},{l:'Oil Filter',n:t.oilFilter,c:'#17a34a'},
    {l:'Fuel Filter',n:t.fuelFilter,c:'#2f6df0'},{l:'Air Filter',n:t.airFilter,c:'#e6952a'}
  ];
  document.getElementById('fbrk').innerHTML=items.map(function(x){
    var pct=Math.round(x.n/tot*100);
    return '<div class="f"><div class="n">'+x.n+'</div><div class="l">'+x.l+' · '+pct+'%</div>'
      +'<div class="bar"><i style="width:'+pct+'%;background:'+x.c+'"></i></div></div>';
  }).join('');
}
function renderTech(){
  var tc=REPORT.detail.technicians||[];
  document.getElementById('techmonth').textContent=REPORT.selectedLabel;
  if(!tc.length){ document.getElementById('tech').innerHTML='<div class="empty">No services recorded this month.</div>'; return; }
  var max=Math.max.apply(null,tc.map(function(t){return t.count;}).concat([1]));
  document.getElementById('tech').innerHTML=tc.map(function(t){
    var w=Math.round(t.count/max*100);
    return '<div class="row"><div class="nm">'+esc(t.name)+'</div><div class="track"><div class="fill" style="width:'+w+'%"></div></div><div class="ct">'+t.count+'</div></div>';
  }).join('');
}
function badge(on,txt){ return '<span class="badge '+(on?'b-on':'b-off')+'">'+txt+'</span>'; }
function renderTable(){
  var rows=(REPORT.detail.rows||[]).slice();
  if(QUERY){ var q=QUERY.toLowerCase();
    rows=rows.filter(function(r){ return (r.dg+' '+r.customer+' '+r.technician+' '+r.location).toLowerCase().indexOf(q)>=0; }); }
  rows.sort(function(a,b){
    var k=SORT.k, av=a[k], bv=b[k];
    if(k==='kva'||k==='hours'){ av=Number(av)||0; bv=Number(bv)||0; return (av-bv)*SORT.dir; }
    av=String(av==null?'':av); bv=String(bv==null?'':bv);
    return av<bv?-SORT.dir:av>bv?SORT.dir:0;
  });
  document.getElementById('tcount').textContent=rows.length+' shown';
  var tb=document.getElementById('tbody');
  if(!rows.length){ tb.innerHTML='<tr><td colspan="7"><div class="empty">No services found'+(QUERY?' for “'+esc(QUERY)+'”':'')+'.</div></td></tr>'; markSort(); return; }
  tb.innerHTML=rows.map(function(r){
    var d=r.date? r.date.slice(8,10)+'/'+r.date.slice(5,7) : '';
    return '<tr><td>'+d+'</td><td class="dg">'+esc(r.dg)+'</td><td>'+(r.kva!=null?esc(r.kva):'—')+'</td>'
      +'<td class="cust" title="'+esc(r.customer)+' · '+esc(r.location)+'">'+esc(r.customer||'—')+'</td>'
      +'<td>'+(r.hours!=null?esc(r.hours):'—')+'</td>'
      +'<td>'+badge(r.oil,'O')+badge(r.oilFilter,'OF')+badge(r.fuelFilter,'FF')+badge(r.airFilter,'AF')+'</td>'
      +'<td>'+esc(r.technician||'—')+'</td></tr>';
  }).join('');
  markSort();
}
function markSort(){
  Array.prototype.forEach.call(document.querySelectorAll('#tbl thead th'),function(th){
    th.classList.remove('sorted','asc');
    if(th.getAttribute('data-k')===SORT.k){ th.classList.add(SORT.dir>0?'asc':'sorted'); }
  });
}

document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
document.getElementById('refreshBtn').addEventListener('click',function(){ load(CURMONTH); });
document.getElementById('printBtn').addEventListener('click',function(){ window.print(); });
document.getElementById('monthSel').addEventListener('change',function(){ load(this.value); });
document.getElementById('search').addEventListener('input',function(){ QUERY=this.value; renderTable(); });
Array.prototype.forEach.call(document.querySelectorAll('#tbl thead th'),function(th){
  var k=th.getAttribute('data-k'); if(!k) return;
  th.addEventListener('click',function(){ if(SORT.k===k){ SORT.dir*=-1; } else { SORT.k=k; SORT.dir=(k==='date'?-1:1); } renderTable(); });
});
gate();
</script>
</body>
</html>
