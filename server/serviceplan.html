<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deluxe — Service Plan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3b66">
<style>
  :root{ --ink:#16202b; --muted:#5b6b7b; --line:#dbe3ea; --panel:#ffffff; --soft:#f4f7fa;
    --brand:#0d3b66; --brand2:#e8a13a; --over:#c0392b; --soon:#b7791f; --ok:#2e7d5b;
    --sans:'Inter','Segoe UI',-apple-system,sans-serif; }
  *{box-sizing:border-box;}
  body{background:#eef2f6;color:var(--ink);font-family:var(--sans);margin:0;padding:18px 14px 70px;}
  .sheet{max-width:900px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(20,40,60,.08);}
  /* Brand header */
  .head{background:linear-gradient(120deg,var(--brand),#134a80);color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .head .co{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;}
  .head h1{font-size:23px;margin:4px 0 2px;font-weight:800;}
  .head .dt{font-size:14px;opacity:.95;}
  .head .badge{background:var(--brand2);color:#241800;font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px;white-space:nowrap;}
  .body{padding:20px 24px;}
  /* Controls (hidden on print) */
  .ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .ctl label{font-size:12px;color:var(--muted);}
  .ctl select,.ctl input[type=date]{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;}
  .btn{border:none;border-radius:8px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer;}
  .btn.print{background:var(--brand);color:#fff;margin-left:auto;}
  .btn.wa{background:#25955a;color:#fff;}
  /* Summary */
  .sum{display:flex;gap:14px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:18px;}
  .sum .m{flex:1;min-width:110px;}
  .sum .n{font-size:24px;font-weight:800;line-height:1;}
  .sum .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:5px;}
  .sum .m.over .n{color:var(--over);}
  /* Zone route card */
  .zone{border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden;break-inside:avoid;}
  .zone.urgent{border-color:#e6b8b1;}
  .zhead{background:var(--soft);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);}
  .zhead .rt{background:var(--brand);color:#fff;width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
  .zhead .zn{font-size:16px;font-weight:800;}
  .zhead .zc{font-size:12px;color:var(--muted);}
  .zhead .team{margin-left:auto;display:flex;align-items:center;gap:6px;}
  .zhead .team label{font-size:11px;color:var(--muted);text-transform:uppercase;}
  .zhead .team input{border:1px dashed #c3ccd6;border-radius:7px;padding:5px 9px;font-size:13px;min-width:120px;background:#fffef8;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--line);background:#fbfdff;}
  td{padding:9px 16px;border-bottom:1px solid #eef2f6;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .dg{font-weight:800;font-family:'JetBrains Mono',monospace;}
  .pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap;}
  .pill.over{background:#fce8e6;color:var(--over);}
  .pill.soon{background:#fdf3e0;color:var(--soon);}
  .pill.ok{background:#e5f4ec;color:var(--ok);}
  .flt{font-size:11px;color:var(--muted);}
  .zfoot{padding:11px 16px;background:#fbfdff;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .maplink{color:var(--brand);text-decoration:none;font-weight:700;font-size:13px;}
  .empty{padding:40px;text-align:center;color:var(--muted);}
  .foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .sign{margin-top:26px;display:flex;gap:40px;flex-wrap:wrap;}
  .sign .s{flex:1;min-width:180px;border-top:1px solid #c3ccd6;padding-top:6px;font-size:11px;color:var(--muted);}
  #overlay{position:fixed;inset:0;background:rgba(13,30,50,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  #overlay .card{background:#fff;border-radius:14px;padding:24px;max-width:340px;width:100%;}
  #overlay input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:10px;font-size:14px;}
  .navback{display:inline-block;margin-bottom:10px;color:var(--brand);text-decoration:none;font-size:13px;font-weight:700;}
  @media print{
    /* Compact single-page layout for the 3-day plan. */
    @page{size:A4 portrait;margin:7mm;}
    html,body{background:#fff;padding:0;margin:0;font-size:9px;}
    .sheet{border:none;box-shadow:none;max-width:none;border-radius:0;padding:0;}
    .noprint{display:none !important;}
    .head{background:var(--brand) !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:7px 10px !important;}
    .head h1{font-size:14px !important;margin:1px 0 !important;}
    .head .co{font-size:8px !important;} .head .dt{font-size:9px !important;}
    .body{padding:0 !important;}
    .zhead,.zfoot,th,.pill{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    /* Stat row: thin single line */
    .sum{gap:8px;padding:5px 8px;margin:6px 0;}
    .sum .n{font-size:14px;} .sum .l{font-size:8px;margin-top:1px;}
    /* Zones: no page breaks, tight spacing */
    .zone{page-break-inside:avoid;break-inside:avoid;margin-bottom:6px;border-radius:6px;}
    .zhead{padding:4px 8px;gap:6px;}
    .zhead .rt{width:16px;height:16px;border-radius:4px;font-size:9px;}
    .zhead .zn{font-size:11px;} .zhead .zc{font-size:8.5px;}
    .zhead .team input{padding:2px 5px;font-size:9px;min-width:90px;}
    table{font-size:9px;}
    th{padding:3px 8px;font-size:8px;}
    td{padding:3px 8px;}
    .flt{font-size:8px;}
    .pill{font-size:8.5px;padding:1px 6px;}
    .zfoot{padding:4px 8px;} .maplink{font-size:9px;}
    .foot{margin-top:8px;padding-top:6px;font-size:8.5px;}
    .sign{margin-top:12px;gap:24px;} .sign .s{font-size:9px;min-width:140px;}
  }

  /* ---- UX polish (additive · motion-safe) ---- */
  .btn{transition:transform .12s ease, box-shadow .15s ease;}
  .btn:hover{box-shadow:0 6px 16px -8px rgba(0,0,0,.28);}
  .btn:active{transform:scale(.97);}
  @media (prefers-reduced-motion: no-preference){
    @keyframes uxRise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
    .sum{animation:uxRise .45s cubic-bezier(.22,.61,.36,1) both;}
    .zone{animation:uxRise .5s cubic-bezier(.22,.61,.36,1) both;}
    .zone:nth-child(2){animation-delay:.05s;} .zone:nth-child(3){animation-delay:.10s;}
    .zone:nth-child(4){animation-delay:.15s;} .zone:nth-child(n+5){animation-delay:.19s;}
  }
</style>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/portal-sw.js').catch(function(){});});}</script>
</head>
<body>
<a class="navback noprint" href="/menu">☰ Menu</a>
<div class="sheet">
  <div class="head">
    <div>
      <div class="co">Deluxe Heavy Equipment Rental L.L.C · Deluxe Energy Solutions L.L.C</div>
      <h1>Generator Service Plan</h1>
      <div class="dt" id="dateLine">—</div>
    </div>
    <div class="badge" id="totBadge">—</div>
  </div>
  <div class="body">
    <div class="ctl noprint">
      <label>Plan date</label><input type="date" id="date">
      <label>Include</label>
      <select id="window">
        <option value="0">Overdue &amp; due that day</option>
        <option value="2">+ next 2 days</option>
        <option value="5" selected>+ next 5 days</option>
        <option value="9999">Everything due</option>
      </select>
      <button class="btn wa" id="shareAll">📲 Share</button>
      <button class="btn print" onclick="window.print()">🖨️ Print / Save PDF</button>
    </div>
    <div id="out"><div class="empty">Building plan…</div></div>
    <div class="sign noprint" id="signRow" style="display:none;">
      <div class="s">Planned / checked by</div>
      <div class="s">Service supervisor</div>
      <div class="s">Date</div>
    </div>
    <div class="foot">
      <span>Deluxe Operations — service plan</span>
      <span>Emergency: 055 335 6428 / 02 554 5718</span>
    </div>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <h2 style="margin:0 0 4px;font-size:18px;">Service Plan — Sign in</h2>
    <p style="color:var(--muted);font-size:13px;margin:0 0 14px;">Sign in to view the service plan.</p>
    <input type="text" id="loginEmail" placeholder="deluxeoperationhead" autocomplete="username">
    <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
    <div style="color:var(--over);font-size:13px;min-height:18px;" id="loginErr"></div>
    <button class="btn print" style="width:100%;margin:0;" id="loginBtn">Sign in</button>
  </div>
</div>

<script>
(function(){
  var LS='deluxeFleetToken';
  var TOKEN=localStorage.getItem(LS)||'';
  var $=function(id){return document.getElementById(id);};
  function authHeaders(){ return {'Authorization':'Bearer '+TOKEN}; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  // default plan date = tomorrow
  var t=new Date(); t.setDate(t.getDate()+1);
  var pad=function(n){return (n<10?'0':'')+n;};
  var tomorrow=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());

  function showLogin(msg){ $('overlay').style.display='flex'; if(msg)$('loginErr').textContent=msg; }
  function hideLogin(){ $('overlay').style.display='none'; load(); }
  async function doLogin(){
    var email=$('loginEmail').value.trim(), password=$('loginPass').value; $('loginErr').textContent='';
    try{ var r=await fetch('/api/fleet/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})});
      var d=await r.json(); if(!r.ok){ $('loginErr').textContent=d.message||'Sign in failed'; return; }
      TOKEN=d.token; localStorage.setItem(LS,TOKEN); hideLogin();
    }catch(e){ $('loginErr').textContent='Network error'; }
  }
  $('loginBtn').addEventListener('click',doLogin);
  $('loginPass').addEventListener('keydown',function(e){ if(e.key==='Enter')doLogin(); });

  function dayDiff(from,to){ if(!to)return null; var a=new Date(from+'T00:00:00'),b=new Date(to+'T00:00:00'); return Math.round((b-a)/86400000); }
  function pill(u){
    // Confirmed hour-meter reading -> show real hours left (hours-first). Otherwise fall back to the date estimate.
    if(u && u.urgent){ var extra=(u.confirmed && u.hoursLeft!=null)?(' · '+u.hoursLeft+'h left'):(u.daysTo!=null?(' · due '+u.daysTo+'d'):''); return '<span class="pill over">🔴 URGENT'+extra+'</span>'; }
    if(u && u.confirmed && u.hoursLeft!=null){ var h=u.hoursLeft; if(h<=0)return '<span class="pill over">OVERDUE '+(-h)+'h</span>'; if(h<=50)return '<span class="pill soon">'+h+'h left</span>'; return '<span class="pill ok">'+h+'h left</span>'; }
    var daysTo=(u&&typeof u==='object')?u.daysTo:u;
    if(daysTo==null)return '<span class="pill ok">—</span>';
    if(daysTo<0)return '<span class="pill over">OVERDUE '+(-daysTo)+'d</span>'; if(daysTo===0)return '<span class="pill soon">DUE</span>'; if(daysTo<=3)return '<span class="pill soon">due '+daysTo+'d</span>'; return '<span class="pill ok">due '+daysTo+'d</span>';
  }

  function teamKey(){ return 'deluxePlanTeams'; }
  function loadTeams(){ try{return JSON.parse(localStorage.getItem(teamKey())||'{}');}catch(e){return {};} }
  function saveTeam(z,v){ var m=loadTeams(); if(v)m[z]=v; else delete m[z]; localStorage.setItem(teamKey(),JSON.stringify(m)); }

  function mapsRoute(units,zone){
    var pts=[]; units.forEach(function(u){ if(typeof u.lat==='number'&&typeof u.lon==='number') pts.push(u.lat+','+u.lon); });
    if(!pts.length) pts=[zone+', Abu Dhabi'];
    return 'https://www.google.com/maps/dir/'+pts.map(encodeURIComponent).join('/');
  }

  var LAST=[];
  var BDMAP={};  // dg -> open-breakdown note, to flag broken units on the plan
  function zoneMsg(zg){
    var team=(loadTeams()[zg.zone]||'').trim();
    var m='🔧 *Deluxe Service Plan*\n📍 *'+zg.zone+'*'+(team?(' — '+team):'')+'  ('+zg.units.length+' unit'+(zg.units.length!==1?'s':'')+')\n';
    zg.units.forEach(function(u){ m+='• '+u.dg+' — '+(u.customer||u.location||'')+' — next @ '+(u.nextHours||'?')+'h'+(u.daysTo<0?(' (OVERDUE '+(-u.daysTo)+'d)'):'')+(u.gatePass?' 🎫 GATE PASS REQUIRED':'')+'\n'; });
    m+='🗺️ Route: '+mapsRoute(zg.units,zg.zone);
    return m;
  }
  function fullMsg(){ var m='🔧 *Deluxe Service Plan — '+$('dateLine').textContent+'*\n'; LAST.forEach(function(zg){ m+='\n'+zoneMsg(zg)+'\n'; }); return m; }
  function shareOrWa(text){ if(navigator.share){navigator.share({text:text}).catch(function(){window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');});} else window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank'); }

  function render(gens,dir){
    var when=$('date').value, win=parseInt($('window').value,10);
    var picked=[], paused=0;
    var HRS_SOON=150; // confirmed units within this many hours of due always show, whatever the date window
    gens.forEach(function(g){
      var d=dir[String(g.dg).toUpperCase()]||{};
      var due=g.due||{};
      var hl=(due.confirmed && due.hoursLeft!=null)?due.hoursLeft:null;
      if(!g.nextServiceDate && hl===null) return; // nothing to plan against
      if(g.offHire || d.zone==='Yard'){ paused++; return; }
      var daysTo=g.nextServiceDate?dayDiff(when,g.nextServiceDate):null;
      var hasConf=(hl!==null);
      // A CONFIRMED hour-meter reading is the source of truth: include/urgency by
      // HOURS only and ignore the stored date (which may be a stale estimate, e.g.
      // a low-use unit whose 450h "+40 day" date passed long before the hours are due).
      var inHours=(hasConf && hl<=HRS_SOON);
      var inWindow=(!hasConf && daysTo!==null && daysTo<=win);
      // An office "urgent" flag forces the unit into the plan (and red), whatever
      // the hours/date window says.
      var urgent=!!g.urgent;
      if(!inWindow && !inHours && !urgent) return;
      // Urgency in "days" so date-estimate and hours-confirmed units sort together:
      // a confirmed reading is converted to days using the unit's real running rate.
      var rate=g.effectiveDailyHours||g.observedDailyHours||12; if(!(rate>0))rate=12;
      var urg=null;
      if(hasConf) urg=hl/rate;            // confirmed -> hours drive urgency, stale date ignored
      else if(inWindow) urg=daysTo;
      if(urgent) urg=-999;                // office-flagged units sort to the very top
      picked.push({dg:g.dg,daysTo:(hasConf?null:daysTo),hoursLeft:hl,confirmed:hasConf,urgent:urgent,urg:urg,nextHours:g.nextService,nextDate:g.nextServiceDate,zone:d.zone||'Unknown',location:d.location||'',customer:d.customer||'',lat:d.lat,lon:d.lon,kva:d.kva,brand:d.brand,noPin:!(d.maps_link),gatePass:!!(g.gatePass||d.gatePass)});
    });
    if(!picked.length){ $('out').innerHTML='<div class="empty">✅ Nothing due in this window for on-hire units.'+(paused?'<br><small>'+paused+' off-hire units paused in the yard are not shown.</small>':'')+'</div>'; $('totBadge').textContent='0 units'; $('signRow').style.display='none'; return; }
    var zones={}; picked.forEach(function(u){ (zones[u.zone]=zones[u.zone]||[]).push(u); });
    var zoneList=Object.keys(zones).map(function(z){ var l=zones[z].sort(function(a,b){return a.urg-b.urg;}); return {zone:z,units:l,worst:l[0].urg}; }).sort(function(a,b){ return a.worst-b.worst || b.units.length-a.units.length; });
    var over=picked.filter(function(u){return u.confirmed?(u.hoursLeft<=0):(u.daysTo<0);}).length;
    LAST=zoneList;
    $('totBadge').textContent=picked.length+' unit'+(picked.length!==1?'s':'');
    var teams=loadTeams();
    var html='<div class="sum">'
      +'<div class="m"><div class="n">'+picked.length+'</div><div class="l">To service</div></div>'
      +'<div class="m over"><div class="n">'+over+'</div><div class="l">Overdue</div></div>'
      +'<div class="m"><div class="n">'+zoneList.length+'</div><div class="l">Areas / routes</div></div>'
      +'<div class="m"><div class="n">'+paused+'</div><div class="l">Paused (yard)</div></div>'
      +'</div>';
    zoneList.forEach(function(zg,zi){
      html+='<div class="zone'+(zg.worst<0?' urgent':'')+'">';
      html+='<div class="zhead"><span class="rt">'+(zi+1)+'</span><span class="zn">'+esc(zg.zone)+'</span>'
        +'<span class="zc">'+zg.units.length+' unit'+(zg.units.length!==1?'s':'')+'</span>'
        +'<span class="team"><label>Team</label><input type="text" placeholder="assign…" value="'+esc(teams[zg.zone]||'')+'" data-zone="'+esc(zg.zone)+'"></span></div>';
      html+='<table><thead><tr><th>DG</th><th>Customer / site</th><th>Rating</th><th>Next service</th><th>Status</th></tr></thead><tbody>';
      zg.units.forEach(function(u){
        html+='<tr><td class="dg">'+esc(u.dg)+(u.noPin?' <span class="flt" title="no exact pin">📍?</span>':'')+'</td>'
          +'<td>'+esc(u.customer||'—')+(u.gatePass?' <span style="display:inline-block;background:#8a6d1a;color:#fff;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:9px;">🎫 GATE PASS</span>':'')+'<div class="flt">'+esc(u.location||'')+'</div></td>'
          +'<td>'+(u.kva?esc(u.kva)+' kVA':'')+'<div class="flt">'+esc(u.brand||'')+'</div></td>'
          +'<td>'+esc(u.nextHours||'?')+' h<div class="flt">'+esc(u.nextDate)+'</div></td>'
          +'<td>'+pill(u)+'</td></tr>';
        var bd=BDMAP[String(u.dg).toUpperCase()];
        if(bd) html+='<tr><td colspan="5" style="color:#e0644a;background:#33201c;font-weight:700;font-size:11px;padding:4px 10px;">🚨 BREAKDOWN — '+esc(bd)+' (fix before servicing)</td></tr>';
      });
      html+='</tbody></table>';
      html+='<div class="zfoot"><a class="maplink" href="'+esc(mapsRoute(zg.units,zg.zone))+'" target="_blank" rel="noopener">🗺️ Open route ('+zg.units.length+' stop'+(zg.units.length!==1?'s':'')+')</a>'
        +'<button class="btn wa noprint" data-wa="'+zi+'" style="padding:6px 12px;">📲 Send team</button></div>';
      html+='</div>';
    });
    $('out').innerHTML=html;
    $('signRow').style.display='';
    $('out').querySelectorAll('input[data-zone]').forEach(function(inp){ inp.addEventListener('input',function(){ saveTeam(inp.getAttribute('data-zone'),inp.value.trim()); }); });
    $('out').querySelectorAll('button[data-wa]').forEach(function(b){ b.addEventListener('click',function(){ var z=LAST[+b.getAttribute('data-wa')]; if(z)shareOrWa(zoneMsg(z)); }); });
  }

  async function load(){
    var nice=new Date($('date').value+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    $('dateLine').textContent=nice;
    $('out').innerHTML='<div class="empty">Building plan…</div>';
    try{
      var sr=await fetch('/api/service/status',{cache:'no-store',headers:authHeaders()});
      if(sr.status===401){ showLogin(); return; }
      var sd=await sr.json();
      var dd=await (await fetch('/api/fleet/directory',{cache:'no-store',headers:authHeaders()})).json();
      BDMAP={};
      try{ var bdj=await (await fetch('/api/breakdowns',{cache:'no-store',headers:authHeaders()})).json();
        (bdj.breakdowns||[]).filter(function(b){return b.status!=='Resolved';}).forEach(function(b){ var dg=String(b.dg||'').toUpperCase(); if(!BDMAP[dg]) BDMAP[dg]=(b.symptom||b.notes||'breakdown'); }); }catch(e){}
      render(sd.generators||[], dd.directory||{});
    }catch(e){ $('out').innerHTML='<div class="empty">Could not load the plan.</div>'; }
  }

  $('date').value=tomorrow;
  $('date').addEventListener('change',load);
  $('window').addEventListener('change',load);
  $('shareAll').addEventListener('click',function(){ shareOrWa(fullMsg()); });
  if(TOKEN){ hideLogin(); } else { showLogin(); }
})();
</script>
</body>
</html>
