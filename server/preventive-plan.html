<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Deluxe — Preventive Service Schedule</title>
<style>
  :root{
    --bg:#0f141a; --panel:#fff; --ink:#15202b; --mut:#667487; --line:#e5e9ef;
    --green:#0b7a3b; --greenD:#0b3d2e; --amber:#e6952a; --red:#d2443a; --blue:#2f6df0;
    --soft:#f4f7f5;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:#eef1f4; color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }

  .top{ position:sticky; top:0; z-index:20; background:var(--greenD); color:#fff;
    padding:11px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; box-shadow:0 2px 10px rgba(0,0,0,.18); }
  .top .brand{ font-weight:800; font-size:15px; display:flex; align-items:center; gap:8px; }
  .top .brand .dot{ width:9px; height:9px; border-radius:50%; background:#49d17f; box-shadow:0 0 0 4px rgba(73,209,127,.18); }
  .top .sp{ flex:1; }
  .top select,.top button{ font:inherit; font-size:13px; border-radius:9px; border:1px solid rgba(255,255,255,.18); padding:8px 11px; }
  .top select{ background:#0e5134; color:#fff; font-weight:600; }
  .top button{ background:rgba(255,255,255,.12); color:#fff; font-weight:700; border:none; cursor:pointer; }
  .top a.nav{ color:#cfe9db; text-decoration:none; font-size:12.5px; font-weight:600; }

  .wrap{ max-width:900px; margin:0 auto; padding:14px 12px 60px; }

  .signin{ max-width:360px; margin:12vh auto; background:#fff; border-radius:16px; padding:26px 22px; box-shadow:0 10px 40px rgba(0,0,0,.18); }
  .signin h2{ margin:0 0 4px; font-size:19px; } .signin p{ margin:0 0 16px; color:var(--mut); font-size:13px; }
  .signin input{ width:100%; font:inherit; font-size:15px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:10px; }
  .signin button{ width:100%; font:inherit; font-weight:700; font-size:15px; padding:12px; border:none; border-radius:10px; background:var(--greenD); color:#fff; cursor:pointer; }
  .err{ color:var(--red); font-size:12.5px; min-height:16px; }

  .strip{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .stat{ background:#fff; border-radius:13px; padding:12px 14px; box-shadow:0 1px 3px rgba(16,24,40,.07); text-align:center; }
  .stat .v{ font-size:26px; font-weight:800; line-height:1; }
  .stat .k{ font-size:10.5px; color:var(--mut); margin-top:4px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
  .stat.r .v{ color:var(--red); } .stat.a .v{ color:var(--amber); } .stat.g .v{ color:var(--green); }

  .day{ background:#fff; border-radius:14px; box-shadow:0 1px 3px rgba(16,24,40,.07); margin-bottom:12px; overflow:hidden; }
  .dhead{ display:flex; align-items:center; gap:10px; padding:11px 15px; border-bottom:1px solid var(--line);
    background:var(--soft); }
  .dhead .dt{ font-weight:800; font-size:14.5px; }
  .dhead .rel{ font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; }
  .dhead .rel.today{ background:#fdeceb; color:var(--red); }
  .dhead .rel.tmrw{ background:#fff3e0; color:var(--amber); }
  .dhead .rel.over{ background:#fdeceb; color:var(--red); }
  .dhead .rel.fut{ background:#eef4ff; color:var(--blue); }
  .dhead .ct{ margin-left:auto; font-size:12px; color:var(--mut); font-weight:600; }

  .u{ display:flex; align-items:center; gap:10px; padding:10px 15px 10px 13px; border-bottom:1px solid #f1f4f7; border-left:4px solid var(--line); }
  .u:last-child{ border-bottom:none; }
  .u.s-over{ border-left-color:var(--red); } .u.s-due{ border-left-color:var(--red); }
  .u.s-soon{ border-left-color:var(--amber); } .u.s-ok{ border-left-color:var(--green); }
  .u.s-confirm{ border-left-color:var(--amber); }
  .u .dg{ font-weight:800; font-size:14px; min-width:66px; }
  .u .mid{ flex:1; min-width:0; }
  .u .mid .cu{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .u .mid .lo{ font-size:11.5px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .u .rt{ text-align:right; flex:0 0 auto; }
  .u .rt .hrs{ font-size:13px; font-weight:800; }
  .u .rt .hrs.r{ color:var(--red); } .u .rt .hrs.a{ color:var(--amber); } .u .rt .hrs.g{ color:var(--green); }
  .u .rt .rate{ font-size:10.5px; color:var(--mut); margin-top:1px; }
  .kva{ font-size:10.5px; color:var(--mut); font-weight:600; }
  .empty{ padding:36px; text-align:center; color:var(--mut); }
  .foot{ text-align:center; color:var(--mut); font-size:11px; margin-top:14px; }
  .note{ font-size:12px; color:var(--mut); margin:2px 2px 12px; }
</style>
</head>
<body>

<div class="top" id="topbar" hidden>
  <div class="brand"><span class="dot"></span> Preventive Schedule</div>
  <div class="sp"></div>
  <select id="horizon" title="How far ahead">
    <option value="7">Next 7 days</option>
    <option value="14" selected>Next 14 days</option>
    <option value="30">Next 30 days</option>
    <option value="999">All upcoming</option>
  </select>
  <button id="refreshBtn" type="button">↻</button>
  <a class="nav" href="/menu">← Menu</a>
</div>

<div class="signin" id="signin" hidden>
  <h2>Deluxe Portal</h2><p>Sign in to view the preventive schedule.</p>
  <input id="em" placeholder="Login" autocomplete="username"/>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password"/>
  <div class="err" id="loginErr"></div>
  <button id="loginBtn" type="button">Sign in</button>
</div>

<div class="wrap" id="app" hidden>
  <div class="note">Built from live hour-meter data — each generator falls on the day its next service is projected (running hours ÷ daily usage). Overdue units show first.</div>
  <div class="strip" id="strip"></div>
  <div id="days"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
var tok=null; try{tok=localStorage.getItem('deluxeFleetToken');}catch(e){}
var GENS=[];
function hdrs(){return {'Authorization':'Bearer '+tok,'Content-Type':'application/json'};}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function show(id,on){var e=document.getElementById(id); if(e) e.hidden=!on;}

function gate(){
  if(!tok){ show('signin',true); show('app',false); show('topbar',false); return; }
  show('signin',false); show('app',true); show('topbar',true); load();
}
function doLogin(){
  var em=(document.getElementById('em').value||'').trim(), pw=(document.getElementById('pw').value||'').trim();
  document.getElementById('loginErr').textContent='';
  fetch('/api/fleet/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})})
    .then(function(r){return r.json();})
    .then(function(d){ if(d&&d.token){ tok=d.token; try{localStorage.setItem('deluxeFleetToken',tok);}catch(_){ } gate(); }
      else document.getElementById('loginErr').textContent='Wrong login'; })
    .catch(function(){ document.getElementById('loginErr').textContent='Connection error'; });
}
function load(){
  fetch('/api/service/status',{headers:hdrs()}).then(function(r){ if(r.status===401){throw{auth:1};} if(!r.ok)throw 0; return r.json(); })
    .then(function(d){ GENS=(d.generators||[]); render(); })
    .catch(function(e){ if(e&&e.auth){ try{localStorage.removeItem('deluxeFleetToken');}catch(_){ } tok=null; gate(); } });
}
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseD(s){ return new Date(String(s).slice(0,10)+'T00:00:00'); }
function dayDiff(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function prettyDate(s){ var d=parseD(s); var wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return wd+' '+String(d.getDate()).padStart(2,'0')+' '+mo; }

function render(){
  var today=ymd(new Date());
  var horizon=Number(document.getElementById('horizon').value||14);
  // on-hire units with a projected next-service date
  var units=GENS.filter(function(g){ return !g.offHire && g.nextServiceDate; }).map(function(g){
    var dd=dayDiff(today, g.nextServiceDate);
    var st = dd<0 ? 's-over' : (dd===0 ? 's-due' : (dd<=3 ? 's-soon' : (g.due&&g.due.state==='confirm'?'s-confirm':'s-ok')));
    return { dg:g.dg, kva:g.kva, customer:g.customer||g.location||'—', location:g.location||'',
      date:String(g.nextServiceDate).slice(0,10), dd:dd, st:st,
      hoursLeft:(g.hoursToService!=null?g.hoursToService:null),
      daily:(g.dailyHours!=null?g.dailyHours:null) };
  });
  // keep overdue (any past) + anything within horizon
  units=units.filter(function(u){ return u.dd<=horizon; });
  units.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:(String(a.dg).localeCompare(String(b.dg))); });

  // summary
  var over=units.filter(function(u){return u.dd<0;}).length;
  var tod=units.filter(function(u){return u.dd===0;}).length;
  document.getElementById('strip').innerHTML=
    '<div class="stat r"><div class="v">'+over+'</div><div class="k">Overdue</div></div>'+
    '<div class="stat a"><div class="v">'+tod+'</div><div class="k">Due today</div></div>'+
    '<div class="stat g"><div class="v">'+units.length+'</div><div class="k">In window</div></div>';

  // group by date
  var groups={}; units.forEach(function(u){ (groups[u.date]=groups[u.date]||[]).push(u); });
  var dates=Object.keys(groups).sort();
  if(!dates.length){ document.getElementById('days').innerHTML='<div class="day"><div class="empty">Nothing due in this window. 🎉</div></div>'; return; }

  var html='';
  dates.forEach(function(dt){
    var dd=dayDiff(today,dt);
    var rel, cls;
    if(dd<0){ rel=Math.abs(dd)+'d overdue'; cls='over'; }
    else if(dd===0){ rel='Today'; cls='today'; }
    else if(dd===1){ rel='Tomorrow'; cls='tmrw'; }
    else { rel='in '+dd+'d'; cls='fut'; }
    var list=groups[dt];
    html+='<div class="day"><div class="dhead"><span class="dt">'+prettyDate(dt)+'</span>'
      +'<span class="rel '+cls+'">'+rel+'</span><span class="ct">'+list.length+' genset'+(list.length!==1?'s':'')+'</span></div>';
    list.forEach(function(u){
      var hv = u.hoursLeft==null ? '—' : (u.hoursLeft<0 ? ('+'+Math.abs(u.hoursLeft)+'h over') : (u.hoursLeft+'h left'));
      var hc = u.hoursLeft==null ? '' : (u.hoursLeft<0 ? 'r' : (u.hoursLeft<=120 ? 'a' : 'g'));
      html+='<div class="u '+u.st+'"><span class="dg">'+esc(u.dg)+'</span>'
        +'<span class="mid"><div class="cu">'+esc(u.customer)+' <span class="kva">'+(u.kva!=null?esc(u.kva)+' kVA':'')+'</span></div>'
        +'<div class="lo">'+esc(u.location)+'</div></span>'
        +'<span class="rt"><div class="hrs '+hc+'">'+hv+'</div>'
        +'<div class="rate">'+(u.daily!=null?('~'+u.daily+' h/day'):'')+'</div></span></div>';
    });
    html+='</div>';
  });
  document.getElementById('days').innerHTML=html;
  document.getElementById('foot').textContent='Deluxe Heavy Equipment L.L.C — live preventive schedule · '+new Date().toLocaleString('en-GB');
}

document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
document.getElementById('refreshBtn').addEventListener('click',load);
document.getElementById('horizon').addEventListener('change',render);
gate();
</script>
</body>
</html>
